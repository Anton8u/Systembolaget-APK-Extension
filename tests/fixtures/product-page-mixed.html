<!-- Product page whose header has volume and price but no "% vol." (e.g. alcohol-free), while a
     "similar products" card further down (not a product-tile) has "% vol." text. The values must NOT be combined. -->
<body>
<header>Site header</header>
<main>
  <div class="content">
    <div class="column">
      <h1>Alkoholfri öl</h1>
      <div class="row"><div class="meta"><span>Burk</span><span>·</span><span>330 ml</span><span>·</span><span>Alkoholfri</span></div><div><span>Nr 1190535</span></div></div>
      <div class="price-row"><span>9:90*</span><span class="sr-only">9 kronor och 90 öre, pant tillkommer</span></div>
    </div>
    <section class="similar">
      <div class="card"><span>Annan produkt</span><span>750 ml</span><span>12 % vol.</span><span>99:-</span></div>
    </section>
  </div>
</main>
<footer>Site footer</footer>
</body>
